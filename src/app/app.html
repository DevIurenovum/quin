<nav class="switch">
  <button type="button" [class.active]="model() === 'bird'" (click)="model.set('bird')">Colibrí</button>
  <button type="button" [class.active]="model() === 'robot'" (click)="model.set('robot')">Robot</button>
</nav>

@if (model() === 'bird') {
  <app-bird-viewer />
} @else {
  <app-robot-viewer />
}
