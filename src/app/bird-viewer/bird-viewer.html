<div class="stage" #stage></div>

@if (error(); as message) {
  <p class="overlay">{{ message }}</p>
} @else if (!loaded()) {
  <div class="overlay">
    <p>{{ progress() < 100 ? 'Cargando colibrí… ' + progress() + '%' : 'Preparando colibrí…' }}</p>
    <div class="bar"><span [style.width.%]="progress()"></span></div>
  </div>
}

<div class="actions" [class.hidden]="!loaded()">
  <button type="button" (click)="toggleFlight()">{{ flying() ? '🌿 Posarse' : '🐦 Volar' }}</button>
</div>
<p class="hint">Mueve el mouse: te sigue con la mirada · arrastra para girar · clic para volar o posarse</p>
